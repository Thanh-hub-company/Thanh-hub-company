name: Feed Git-Pet

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *" # Kiểm tra mỗi ngày
  workflow_dispatch:

jobs:
  pet-status:
    runs-on: ubuntu-latest
    steps:
      - name: Pet is eating commits
        run: |
          echo "🍖 Bé thú cưng đã nhận được commit mới từ Lê Tuấn Thành!"
          echo "🔥 Tăng điểm kinh nghiệm EXP và hồi phục sức khỏe!"
